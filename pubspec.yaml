name: jobready_app
description: "JobReady — Coach CV & Entretien Intelligent"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: any

  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_language_id: ^0.13.1
  google_mlkit_face_detection: ^0.13.1

  google_generative_ai: ^0.4.7

  camera: ^0.11.2
  image_picker: ^1.2.1

  speech_to_text: ^7.3.0

  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

  flutter_local_notifications: ^19.5.0
  flutter_tts: ^4.2.3
  vibration: ^3.1.4

  http: ^1.2.2

  # ── Firebase ──────────────────────────────
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
